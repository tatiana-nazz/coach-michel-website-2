name: Operator deterministic format repair

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - '.github/workflows/operator-repair-format.yml'

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message != 'chore: apply deterministic Prettier repair' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic Prettier repair
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/operator-repair-format.yml .github/workflows/quality.yml package.json src/platform/auth/session.ts
          pnpm exec prettier --check .github/workflows/operator-repair-format.yml .github/workflows/quality.yml package.json src/platform/auth/session.ts

      - name: Commit and push formatted files
        run: |
          set -euo pipefail
          git config user.name 'operator-repair-bot'
          git config user.email 'operator-repair-bot@users.noreply.github.com'
          git add -- .github/workflows/operator-repair-format.yml .github/workflows/quality.yml package.json src/platform/auth/session.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'chore: apply deterministic Prettier repair'
            git push origin HEAD:p4/bootstrap-greenfield
          fi

      - name: Verify repository-wide formatting
        run: pnpm format:check
