name: Operator Prettier path diagnostic

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - '.github/workflows/operator-repair-format.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Capture exact Prettier differences
        run: |
          set +e
          pnpm exec prettier --list-different . > PRETTIER_DIFFERENCES.txt
          status=$?
          set -e
          echo "prettier_exit_code=$status" >> PRETTIER_DIFFERENCES.txt
          cat PRETTIER_DIFFERENCES.txt

      - name: Commit diagnostic report
        run: |
          set -euo pipefail
          git config user.name 'operator-repair-bot'
          git config user.email 'operator-repair-bot@users.noreply.github.com'
          git add PRETTIER_DIFFERENCES.txt
          git commit -m 'ci: capture exact Prettier differing paths'
          git push origin HEAD:p4/bootstrap-greenfield
