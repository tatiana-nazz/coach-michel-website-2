name: Operator full remediation validation

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - '.github/workflows/operator-repair-format.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact remaining Prettier repair
        run: |
          set -euo pipefail
          pnpm exec prettier --write tests/unit/session-authorization.test.ts
          pnpm exec prettier --check tests/unit/session-authorization.test.ts

      - name: Commit one-file format fix and remove diagnostic report
        run: |
          set -euo pipefail
          git config user.name 'operator-repair-bot'
          git config user.email 'operator-repair-bot@users.noreply.github.com'
          git rm -f PRETTIER_DIFFERENCES.txt
          git add -- tests/unit/session-authorization.test.ts
          git commit -m 'fix: normalize session authorization test formatting'
          git push origin HEAD:p4/bootstrap-greenfield

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Accessibility foundation tests
        run: pnpm test:a11y

      - name: RTL foundation tests
        run: pnpm test:rtl

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm audit --audit-level high
