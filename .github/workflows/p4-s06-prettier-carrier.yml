name: P4-S06 exact Prettier carrier

on:
  push:
    branches:
      - ops/p4-s06-prettier-carrier-5ad5baaf

permissions:
  contents: write

jobs:
  format-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Materialize exact Prettier output
        run: pnpm exec prettier --write src/features/access/screens/scr-acc-001/private-access-entry.model.ts

      - name: Guard and commit exact carrier bytes
        shell: bash
        run: |
          set -euo pipefail
          target='src/features/access/screens/scr-acc-001/private-access-entry.model.ts'
          changed="$(git diff --name-only)"
          if [ "$changed" != "$target" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'cmh-operator-carrier'
          git config user.email 'cmh-operator-carrier@users.noreply.github.com'
          git add "$target"
          git commit -m 'chore: materialize exact P4-S06 Prettier bytes'
          git push origin HEAD:ops/p4-s06-prettier-carrier-5ad5baaf
