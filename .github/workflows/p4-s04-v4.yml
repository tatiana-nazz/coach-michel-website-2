name: P4-S04 v4 retired carrier

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - .github/workflows/p4-s04-v4.yml

permissions:
  contents: read

jobs:
  retired:
    if: "${{ false }}"
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Retired carrier
        shell: powershell
        run: Write-Output 'P4-S04 v4 is retired. No execution is authorized.'
