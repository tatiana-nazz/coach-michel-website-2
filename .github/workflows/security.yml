name: Zero-cost dependency security audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap portable PowerShell 7 for pwsh shell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $version = '7.6.5'
          $expectedSha256 = '32eb8f6cdce08f86e987d625a2733e54ac3e289ae7e1621b14c0b5bcec2434ea'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "pwsh-$version"
          $url = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing

          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "PowerShell archive SHA-256 mismatch. Expected $expectedSha256, observed $actualSha256."
          }

          if (Test-Path $destination) {
            Remove-Item -Path $destination -Recurse -Force
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force

          $pwsh = Join-Path $destination 'pwsh.exe'
          if (-not (Test-Path $pwsh)) {
            throw "pwsh.exe not found after portable PowerShell extraction."
          }

          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        shell: pwsh
        run: pnpm audit --audit-level high
