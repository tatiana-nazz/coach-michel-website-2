name: P4-S08 governed API integration execution

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - '.github/workflows/p4-s08-execution.yml'

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          clean: true
          persist-credentials: true

      - name: Validate state-bound ancestry and scope
        run: |
          set -euo pipefail
          START=3205312969567d638fd4c47c0c9edcf7ecd7857a
          git merge-base --is-ancestor "$START" HEAD
          git diff --name-only "$START" HEAD | sort > /tmp/p4s08-candidate-paths.txt
          cat /tmp/p4s08-candidate-paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/p4-s08-execution.yml",
              "package.json",
              "src/app/access/session/route.ts",
              "src/features/access/screens/scr-acc-001/private-access-entry.model.ts",
              "src/features/access/screens/scr-acc-001/private-access-entry.tsx",
              "src/platform/api/browser-client.ts",
              "src/platform/api/client.ts",
              "src/platform/api/operations.ts",
              "src/platform/auth/credential-submission.ts",
              "src/platform/auth/session.ts",
              "src/platform/auth/supabase-server.ts",
              "tests/a11y/private-access-entry.test.ts",
              "tests/contract/access-session-contract.test.ts",
              "tests/unit/api-operation-registry.test.ts",
              "tests/unit/browser-api-client.test.ts",
              "tests/unit/credential-submission.test.ts",
              "tests/unit/private-access-entry-model.test.ts",
          }
          observed = set(Path("/tmp/p4s08-candidate-paths.txt").read_text().splitlines())
          unexpected = sorted(observed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected candidate paths: {unexpected}")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Resolve deterministic lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Normalize authorized files
        run: |
          pnpm exec prettier --write \
            .github/workflows/p4-s08-execution.yml \
            package.json \
            src/app/access/session/route.ts \
            src/features/access/screens/scr-acc-001/private-access-entry.model.ts \
            src/features/access/screens/scr-acc-001/private-access-entry.tsx \
            src/platform/api/browser-client.ts \
            src/platform/api/client.ts \
            src/platform/api/operations.ts \
            src/platform/auth/credential-submission.ts \
            src/platform/auth/session.ts \
            src/platform/auth/supabase-server.ts \
            tests/a11y/private-access-entry.test.ts \
            tests/contract/access-session-contract.test.ts \
            tests/unit/api-operation-registry.test.ts \
            tests/unit/browser-api-client.test.ts \
            tests/unit/credential-submission.test.ts \
            tests/unit/private-access-entry-model.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Accessibility foundation tests
        run: pnpm test:a11y

      - name: RTL foundation tests
        run: pnpm test:rtl

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Validate post-gate working tree scope
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/p4-s08-execution.yml",
              "pnpm-lock.yaml",
              "package.json",
              "src/app/access/session/route.ts",
              "src/features/access/screens/scr-acc-001/private-access-entry.model.ts",
              "src/features/access/screens/scr-acc-001/private-access-entry.tsx",
              "src/platform/api/browser-client.ts",
              "src/platform/api/client.ts",
              "src/platform/api/operations.ts",
              "src/platform/auth/credential-submission.ts",
              "src/platform/auth/session.ts",
              "src/platform/auth/supabase-server.ts",
              "tests/a11y/private-access-entry.test.ts",
              "tests/contract/access-session-contract.test.ts",
              "tests/unit/api-operation-registry.test.ts",
              "tests/unit/browser-api-client.test.ts",
              "tests/unit/credential-submission.test.ts",
              "tests/unit/private-access-entry-model.test.ts",
          }
          output = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          observed = {line[3:] for line in output.splitlines() if line}
          unexpected = sorted(observed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected post-gate working-tree paths: {unexpected}")
          PY

      - name: Finalize validated P4-S08 commit
        run: |
          set -euo pipefail
          git config user.name 'p4-s08-execution-bot'
          git config user.email 'p4-s08-execution-bot@users.noreply.github.com'
          git rm -- .github/workflows/p4-s08-execution.yml
          git add -- \
            pnpm-lock.yaml \
            package.json \
            src/app/access/session/route.ts \
            src/features/access/screens/scr-acc-001/private-access-entry.model.ts \
            src/features/access/screens/scr-acc-001/private-access-entry.tsx \
            src/platform/api/browser-client.ts \
            src/platform/api/client.ts \
            src/platform/api/operations.ts \
            src/platform/auth/credential-submission.ts \
            src/platform/auth/session.ts \
            src/platform/auth/supabase-server.ts \
            tests/a11y/private-access-entry.test.ts \
            tests/contract/access-session-contract.test.ts \
            tests/unit/api-operation-registry.test.ts \
            tests/unit/browser-api-client.test.ts \
            tests/unit/credential-submission.test.ts \
            tests/unit/private-access-entry-model.test.ts
          git commit -m 'feat: finalize P4-S08 Supabase session integration'
          git push origin HEAD:p4/bootstrap-greenfield
