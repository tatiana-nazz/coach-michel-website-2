name: Bootstrap deterministic pnpm lockfile

on:
  push:
    branches:
      - p4/bootstrap-greenfield

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Generate lockfile and normalize scaffold formatting
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
            pnpm exec prettier --check .
            exit 0
          fi

          pnpm install
          pnpm exec prettier --write .
          test -s pnpm-lock.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json .npmrc .prettierrc.json .prettierignore \
            eslint.config.mjs next.config.mjs tsconfig.json vitest.config.ts playwright.config.ts \
            src tests .github/workflows
          git commit -m "chore: finalize scaffold lockfile and formatting [lockfile-bootstrap]"
          git push origin HEAD:p4/bootstrap-greenfield
