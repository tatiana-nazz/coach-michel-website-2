name: P4-S04 format and ESLint compatibility remediation

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

concurrency:
  group: p4-s04-format-eslint-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'ci: run P4-S04 format and ESLint remediation v2' }}"
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Prepare isolated checkout directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = Join-Path $env:GITHUB_WORKSPACE '_central_p4s04'
          if (Test-Path -LiteralPath $checkout) {
            Remove-Item -LiteralPath $checkout -Recurse -Force
          }
          Write-Output "Prepared isolated checkout path: $checkout"

      - name: Checkout exact carrier commit into isolated directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          clean: true
          path: _central_p4s04

      - name: Validate isolated carrier binding
        shell: powershell
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredParent = '72e6c777f2052db15694457bb033f77ca54856bc'
          $requiredPackageBlob = 'f09f9ce0392c63e5445dbdae25cc07ad28829bcd'
          $requiredWorkflowPath = '.github/workflows/bootstrap-lockfile.yml'

          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $requiredParent) {
            throw "Carrier parent mismatch. Expected $requiredParent, observed $parent."
          }

          $changed = @((git diff --name-only HEAD^ HEAD --) | Where-Object { $_ })
          if ($changed.Count -ne 1 -or ($changed -join "`n") -ne $requiredWorkflowPath) {
            throw "Carrier commit changed unexpected paths: $($changed -join ', ')"
          }

          $packageBlob = (git rev-parse HEAD:package.json).Trim()
          if ($packageBlob -ne $requiredPackageBlob) {
            throw "package.json blob mismatch. Expected $requiredPackageBlob, observed $packageBlob."
          }

          $lockEntries = @((git ls-tree --name-only HEAD -- pnpm-lock.yaml) | Where-Object { $_ })
          if ($lockEntries.Count -ne 0) {
            throw 'pnpm-lock.yaml unexpectedly exists before remediation.'
          }

          $status = @((git status --porcelain) | Where-Object { $_ })
          if ($status.Count -ne 0) {
            throw "Isolated working tree is not clean before remediation: $($status -join ', ')"
          }

          Write-Output "Carrier parent: $parent"
          Write-Output "Carrier changed path: $($changed -join ', ')"
          Write-Output "package.json blob: $packageBlob"
          Write-Output "pnpm-lock.yaml state: ABSENT"
          Write-Output 'Isolated working tree: CLEAN'

      - name: Bootstrap portable PowerShell 7
        shell: powershell
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $version = '7.6.5'
          $expectedSha256 = '32eb8f6cdce08f86e987d625a2733e54ac3e289ae7e1621b14c0b5bcec2434ea'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "pwsh-$version"
          $url = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "PowerShell archive SHA-256 mismatch. Expected $expectedSha256, observed $actualSha256."
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force

          $pwsh = Join-Path $destination 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwsh)) {
            throw 'pwsh.exe not found after extraction.'
          }

          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Validate self-hosted Windows X64 runner
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Expected RUNNER_OS=Windows, observed '$env:RUNNER_OS'."
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected RUNNER_ARCH=X64, observed '$env:RUNNER_ARCH'."
          }
          Write-Output "Runner name: $env:RUNNER_NAME"
          Write-Output "Runner OS: $env:RUNNER_OS"
          Write-Output "Runner architecture: $env:RUNNER_ARCH"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Apply exact ESLint compatibility pin
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'package.json'
          $before = [System.IO.File]::ReadAllText($path)
          $from = '"eslint": "10.8.0"'
          $to = '"eslint": "9.39.5"'
          $count = ([regex]::Matches($before, [regex]::Escape($from))).Count
          if ($count -ne 1) {
            throw "Expected exactly one ESLint version token, observed $count."
          }

          $after = $before.Replace($from, $to)
          [System.IO.File]::WriteAllText(
            $path,
            $after,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Generate deterministic pnpm lockfile
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install
          if ($LASTEXITCODE -ne 0) {
            throw "pnpm install failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath 'pnpm-lock.yaml')) {
            throw 'pnpm-lock.yaml was not generated.'
          }
          if ((Get-Item -LiteralPath 'pnpm-lock.yaml').Length -le 0) {
            throw 'pnpm-lock.yaml is empty.'
          }

      - name: Normalize authorized scaffold formatting
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec prettier --write `
            package.json `
            .prettierrc.json `
            eslint.config.mjs `
            next.config.mjs `
            tsconfig.json `
            vitest.config.ts `
            playwright.config.ts `
            "src/**/*.{ts,tsx,css,md,json}" `
            "tests/**/*.{ts,tsx,md}" `
            ".github/workflows/*.yml"
          if ($LASTEXITCODE -ne 0) {
            throw "Prettier normalization failed with exit code $LASTEXITCODE."
          }

      - name: Validate authorized changed-path scope before gates
        id: scope_before
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-AllowedPath([string]$Path) {
            if ($Path -eq 'pnpm-lock.yaml') { return $true }
            $allowedRoot = @(
              'package.json',
              '.prettierrc.json',
              'eslint.config.mjs',
              'next.config.mjs',
              'tsconfig.json',
              'vitest.config.ts',
              'playwright.config.ts'
            )
            if ($allowedRoot -contains $Path) { return $true }
            if ($Path.StartsWith('src/')) { return $true }
            if ($Path.StartsWith('tests/')) { return $true }
            if ($Path.StartsWith('.github/workflows/')) { return $true }
            return $false
          }

          $changed = @(
            @(
              git diff --name-only
              git ls-files --others --exclude-standard
            ) | Where-Object { $_ } | Sort-Object -Unique
          )

          if (-not ($changed -contains 'pnpm-lock.yaml')) {
            throw 'pnpm-lock.yaml is not present in the change set.'
          }

          $forbidden = @($changed | Where-Object { -not (Test-AllowedPath $_) })
          if ($forbidden.Count -gt 0) {
            throw "Out-of-scope changed paths detected: $($forbidden -join ', ')"
          }

          $diffText = git diff --no-ext-diff --binary
          $diffHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes(($diffText -join "`n"))
            )
          ).ToLowerInvariant()

          "tracked_diff_sha256=$diffHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output 'Authorized changed paths before gates:'
          $changed | ForEach-Object { Write-Output " - $_" }

      - name: Format check
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm format:check

      - name: Lint
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm lint

      - name: Typecheck
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm typecheck

      - name: Unit tests
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm test:unit

      - name: Contract tests
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm test:contract

      - name: Accessibility foundation tests
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm test:a11y

      - name: RTL foundation tests
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm test:rtl

      - name: Build
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm build

      - name: Install Playwright Chromium
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm exec playwright install chromium

      - name: E2E tests
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm test:e2e

      - name: Dependency audit
        shell: pwsh
        working-directory: _central_p4s04
        run: pnpm audit --audit-level high

      - name: Revalidate changed-path scope after all gates
        shell: pwsh
        working-directory: _central_p4s04
        env:
          PRE_GATE_TRACKED_DIFF_SHA256: ${{ steps.scope_before.outputs.tracked_diff_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-AllowedPath([string]$Path) {
            if ($Path -eq 'pnpm-lock.yaml') { return $true }
            $allowedRoot = @(
              'package.json',
              '.prettierrc.json',
              'eslint.config.mjs',
              'next.config.mjs',
              'tsconfig.json',
              'vitest.config.ts',
              'playwright.config.ts'
            )
            if ($allowedRoot -contains $Path) { return $true }
            if ($Path.StartsWith('src/')) { return $true }
            if ($Path.StartsWith('tests/')) { return $true }
            if ($Path.StartsWith('.github/workflows/')) { return $true }
            return $false
          }

          $changed = @(
            @(
              git diff --name-only
              git ls-files --others --exclude-standard
            ) | Where-Object { $_ } | Sort-Object -Unique
          )

          $forbidden = @($changed | Where-Object { -not (Test-AllowedPath $_) })
          if ($forbidden.Count -gt 0) {
            throw "Out-of-scope changed paths detected after gates: $($forbidden -join ', ')"
          }

          $diffText = git diff --no-ext-diff --binary
          $diffHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData(
              [System.Text.Encoding]::UTF8.GetBytes(($diffText -join "`n"))
            )
          ).ToLowerInvariant()

          if ($diffHash -ne $env:PRE_GATE_TRACKED_DIFF_SHA256) {
            throw 'Tracked scaffold files changed during retained gates after Prettier normalization.'
          }

          if (-not (Test-Path -LiteralPath 'pnpm-lock.yaml')) {
            throw 'pnpm-lock.yaml disappeared during retained gates.'
          }
          if ((Get-Item -LiteralPath 'pnpm-lock.yaml').Length -le 0) {
            throw 'pnpm-lock.yaml is empty after retained gates.'
          }

      - name: Commit authorized P4-S04 remediation output
        shell: pwsh
        working-directory: _central_p4s04
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- pnpm-lock.yaml package.json .prettierrc.json `
            eslint.config.mjs next.config.mjs tsconfig.json vitest.config.ts `
            playwright.config.ts src tests .github/workflows

          $staged = @((git diff --cached --name-only) | Where-Object { $_ } | Sort-Object -Unique)
          if (-not ($staged -contains 'pnpm-lock.yaml')) {
            throw 'pnpm-lock.yaml is not staged.'
          }
          if ($staged.Count -eq 0) {
            throw 'No authorized remediation changes are staged.'
          }

          $forbidden = @(
            $staged | Where-Object {
              $path = $_
              -not (
                $path -eq 'pnpm-lock.yaml' -or
                $path -eq 'package.json' -or
                $path -eq '.prettierrc.json' -or
                $path -eq 'eslint.config.mjs' -or
                $path -eq 'next.config.mjs' -or
                $path -eq 'tsconfig.json' -or
                $path -eq 'vitest.config.ts' -or
                $path -eq 'playwright.config.ts' -or
                $path.StartsWith('src/') -or
                $path.StartsWith('tests/') -or
                $path.StartsWith('.github/workflows/')
              )
            }
          )
          if ($forbidden.Count -gt 0) {
            throw "Forbidden staged paths: $($forbidden -join ', ')"
          }

          Write-Output 'Staged authorized remediation paths:'
          $staged | ForEach-Object { Write-Output " - $_" }

          git commit -m 'chore: finalize P4-S04 formatting and ESLint compatibility [self-hosted-remediation]'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with exit code $LASTEXITCODE."
          }

          git push origin HEAD:p4/bootstrap-greenfield
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed with exit code $LASTEXITCODE."
          }
