name: P4-S04 bounded ESLint compatibility remediation

on:
  push:
    branches:
      - p4/bootstrap-greenfield
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

concurrency:
  group: p4-s04-bounded-eslint-carrier
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate carrier commit binding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredParent = '14af1a84ab1d394872b31d27819323c54e6b9039'
          $requiredPackageBlob = 'f09f9ce0392c63e5445dbdae25cc07ad28829bcd'
          $requiredWorkflowPath = '.github/workflows/bootstrap-lockfile.yml'

          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $requiredParent) {
            throw "Carrier parent mismatch. Expected $requiredParent, observed $parent."
          }

          $changed = @(git diff --name-only HEAD^ HEAD) | Where-Object { $_ }
          if ($changed.Count -ne 1 -or $changed[0] -ne $requiredWorkflowPath) {
            throw "Carrier commit changed unexpected paths: $($changed -join ', ')"
          }

          $packageBlob = (git rev-parse HEAD:package.json).Trim()
          if ($packageBlob -ne $requiredPackageBlob) {
            throw "package.json blob mismatch. Expected $requiredPackageBlob, observed $packageBlob."
          }

          git cat-file -e HEAD:pnpm-lock.yaml 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'pnpm-lock.yaml unexpectedly exists before remediation.'
          }

          $status = @(git status --porcelain) | Where-Object { $_ }
          if ($status.Count -ne 0) {
            throw "Working tree is not clean before remediation: $($status -join ', ')"
          }

      - name: Bootstrap portable PowerShell 7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $version = '7.6.5'
          $expectedSha256 = '32eb8f6cdce08f86e987d625a2733e54ac3e289ae7e1621b14c0b5bcec2434ea'
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-x64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "pwsh-$version"
          $url = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "PowerShell archive SHA-256 mismatch. Expected $expectedSha256, observed $actualSha256."
          }

          if (Test-Path $destination) {
            Remove-Item -Path $destination -Recurse -Force
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force

          $pwsh = Join-Path $destination 'pwsh.exe'
          if (-not (Test-Path $pwsh)) {
            throw 'pwsh.exe not found after extraction.'
          }

          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Validate self-hosted Windows X64 runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Expected RUNNER_OS=Windows, observed '$env:RUNNER_OS'."
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected RUNNER_ARCH=X64, observed '$env:RUNNER_ARCH'."
          }
          Write-Output "Runner name: $env:RUNNER_NAME"
          Write-Output "Runner OS: $env:RUNNER_OS"
          Write-Output "Runner architecture: $env:RUNNER_ARCH"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Apply exact ESLint compatibility pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'package.json'
          $before = [System.IO.File]::ReadAllText($path)
          $from = '"eslint": "10.8.0"'
          $to = '"eslint": "9.39.5"'
          $count = ([regex]::Matches($before, [regex]::Escape($from))).Count
          if ($count -ne 1) {
            throw "Expected exactly one ESLint version token, observed $count."
          }

          $after = $before.Replace($from, $to)
          [System.IO.File]::WriteAllText(
            $path,
            $after,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Generate pnpm lockfile and install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install
          if ($LASTEXITCODE -ne 0) {
            throw "pnpm install failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path 'pnpm-lock.yaml')) {
            throw 'pnpm-lock.yaml was not generated.'
          }
          if ((Get-Item 'pnpm-lock.yaml').Length -le 0) {
            throw 'pnpm-lock.yaml is empty.'
          }

      - name: Validate exact remediation scope before gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique

          $expected = @('package.json', 'pnpm-lock.yaml') | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected remediation paths: $($changed -join ', ')"
          }

          $packageDiff = @(git diff -- package.json)
          $requiredRemoved = '-    "eslint": "10.8.0",'
          $requiredAdded = '+    "eslint": "9.39.5",'
          if (-not ($packageDiff -contains $requiredRemoved)) {
            throw 'Authorized package.json removal was not found.'
          }
          if (-not ($packageDiff -contains $requiredAdded)) {
            throw 'Authorized package.json addition was not found.'
          }

      - name: Format check
        shell: pwsh
        run: pnpm format:check

      - name: Lint
        shell: pwsh
        run: pnpm lint

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Unit tests
        shell: pwsh
        run: pnpm test:unit

      - name: Contract tests
        shell: pwsh
        run: pnpm test:contract

      - name: Accessibility foundation tests
        shell: pwsh
        run: pnpm test:a11y

      - name: RTL foundation tests
        shell: pwsh
        run: pnpm test:rtl

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: E2E tests
        shell: pwsh
        run: pnpm test:e2e

      - name: Dependency audit
        shell: pwsh
        run: pnpm audit --audit-level high

      - name: Capture final remediation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique

          $expected = @('package.json', 'pnpm-lock.yaml') | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected paths after gates: $($changed -join ', ')"
          }

          Write-Output 'Final authorized changed paths:'
          $changed | ForEach-Object { Write-Output " - $_" }
          Write-Output "package.json SHA-256: $((Get-FileHash package.json -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Output "pnpm-lock.yaml SHA-256: $((Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Output 'Authorized package.json diff:'
          git diff -- package.json

      - name: Commit exact P4-S04 remediation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- package.json pnpm-lock.yaml

          $staged = @(git diff --cached --name-only) | Where-Object { $_ } | Sort-Object -Unique
          $expected = @('package.json', 'pnpm-lock.yaml') | Sort-Object
          if (($staged -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected staged paths: $($staged -join ', ')"
          }

          git commit -m 'chore: align P4-S04 ESLint compatibility'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with exit code $LASTEXITCODE."
          }

          git push origin HEAD:p4/bootstrap-greenfield
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed with exit code $LASTEXITCODE."
          }
