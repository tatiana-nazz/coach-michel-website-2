name: P4-S04 exact Prettier carrier

on:
  push:
    branches:
      - ops/p4-s04-prettier-carrier-76b6d658
    paths:
      - '.github/workflows/p4-s05-format-probe.yml'

permissions:
  contents: write

jobs:
  carrier:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Materialize exact three-file Prettier output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            '.github/workflows/quality.yml',
            'package.json',
            'src/platform/auth/session.ts'
          )

          pnpm exec prettier --write @allowed
          if ($LASTEXITCODE -ne 0) { throw 'Prettier write failed.' }

          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw ('Unexpected changed paths: ' + ($unexpected -join ', '))
          }
          if ($changed.Count -eq 0) {
            throw 'Expected formatting delta was empty.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- @allowed
          git commit -m 'chore: materialize retained Prettier remediation'
          if ($LASTEXITCODE -ne 0) { throw 'Carrier commit failed.' }
          git push origin HEAD:${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { throw 'Carrier push failed.' }
