name: P4-S04 exact Prettier carrier

on:
  push:
    branches:
      - ops/p4-s04-prettier-carrier-76b6d658
    paths:
      - '.github/workflows/p4-s05-format-probe.yml'

permissions:
  contents: write

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Materialize exact three-file Prettier output
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            '.github/workflows/quality.yml'
            'package.json'
            'src/platform/auth/session.ts'
          )

          pnpm exec prettier --write "${allowed[@]}"

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            permitted=false
            for allowed_path in "${allowed[@]}"; do
              if [[ "$path" == "$allowed_path" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unexpected changed path: $path" >&2
              exit 1
            fi
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'Expected formatting delta was empty.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${allowed[@]}"
          git commit -m 'chore: materialize retained Prettier remediation'
          git push origin "HEAD:${{ github.ref_name }}"
