name: P4-S05 exact one-file Prettier carrier

on:
  push:
    branches:
      - ops/p4-s05-prettier-carrier-c664e793
    paths:
      - '.github/workflows/p4-s05-format-probe.yml'

permissions:
  contents: write

concurrency:
  group: p4-s05-exact-prettier-carrier-c664e793
  cancel-in-progress: false

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify carrier source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "675143fe400882290a0860d2f4489beaedeceb32"
          test "$(git rev-parse HEAD:tests/unit/scoped-authorization-policy.test.ts)" = "91df5a948d1b0adaa71080aaaf286e8e9400ae4c"
          test "$(git rev-parse HEAD:.prettierrc.json)" = "47174e441851e7811ccf97e9ecd4f0a8f3c63105"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Materialize exact Prettier 3.9.6 output
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec prettier --version)" = "3.9.6"
          pnpm exec prettier --write "tests/unit/scoped-authorization-policy.test.ts"
          pnpm exec prettier --check "tests/unit/scoped-authorization-policy.test.ts"

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tests/unit/scoped-authorization-policy.test.ts"

          echo "PRETTIER_POST_BLOB=$(git hash-object 'tests/unit/scoped-authorization-policy.test.ts')"
          git diff --check
          git diff -- "tests/unit/scoped-authorization-policy.test.ts"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "tests/unit/scoped-authorization-policy.test.ts"
          git commit -m 'chore: materialize P4-S05 exact Prettier output'
          git push origin "HEAD:${{ github.ref_name }}"
