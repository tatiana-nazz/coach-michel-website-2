name: Scaffold quality gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Format check
        shell: pwsh
        run: pnpm format:check

      - name: Lint
        shell: pwsh
        run: pnpm lint

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Unit tests
        shell: pwsh
        run: pnpm test:unit

      - name: Contract tests
        shell: pwsh
        run: pnpm test:contract

      - name: Accessibility foundation tests
        shell: pwsh
        run: pnpm test:a11y

      - name: RTL foundation tests
        shell: pwsh
        run: pnpm test:rtl

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Install Playwright Chromium
        shell: pwsh
        run: pnpm exec playwright install chromium

      - name: E2E tests
        shell: pwsh
        run: pnpm test:e2e
